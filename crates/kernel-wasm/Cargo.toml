# The Rust twin of packages/core/src/kernel.
#
# Built as a raw cdylib with `#[no_mangle] pub extern "C"` exports over linear
# memory — deliberately no wasm-bindgen and no wasm-pack. Those tools generate
# glue that sits between the source and the float operations, and the entire
# point of this crate is that nothing does. Adding either needs a decision, not
# a convenience commit.
[package]
name = "kernel-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Rust/WASM twin of the TypeScript generation kernel. Must hash bit-identically to it."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Optimisation must never change float results — LLVM only reassociates or
# contracts to FMA under fast-math, which Rust never enables. `pnpm test:wasm`
# runs the parity battery against the release build, so this is verified rather
# than assumed.
panic = "abort"

# Standalone workspace: there is no Cargo workspace above `crates/`, and being
# explicit stops Cargo walking up into unrelated directories.
[workspace]
