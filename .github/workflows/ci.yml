name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: lint, typecheck and the kernel whitelist on one runner. Cheap
  # failures should not wait on the full OS matrix.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # Determinism matrix. PRD §9.1 requires at least two OSes; take all three.
  # WP4 adds the Playwright browser cells (chromium/firefox/webkit) alongside
  # this Node reference run.
  test:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # The determinism promise itself (PRD R16). Every OS must produce
      # byte-identical hashes; WP4 adds the browser legs of this same check.
      - run: pnpm golden:verify

  # WP3: the Rust/WASM twin must hash identically to the TypeScript kernel.
  #
  # A separate job rather than a matrix cell, because it is the only one needing
  # a Rust toolchain and because its failure means something different from the
  # others: the matrix asks "does this kernel agree with itself everywhere?",
  # this asks "do two independent implementations agree with each other?". One
  # platform is enough for that — the twin is compared against the TypeScript
  # kernel, and the TypeScript kernel is what the matrix carries across
  # platforms.
  #
  # `pnpm golden:parity` fails on a missing .wasm rather than skipping. The
  # unit-suite parity test does skip, so that a clone without Rust can still run
  # `pnpm test`; this job is what makes the check non-optional.
  wasm-parity:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Relaxed-SIMD is nondeterministic by design. This runs with rustc present,
      # so the authoritative effective-flag probe is not skipped here.
      - run: pnpm lint:wasm
      - run: pnpm wasm:build
      - run: pnpm wasm:test
      - run: pnpm build
      - run: pnpm golden:parity
